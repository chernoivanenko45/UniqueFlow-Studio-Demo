name: Feature request
description: Vote for what UniqueFlow Studio should build next.
title: "[Idea]: "
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Automatic editing
        - Music and beat analysis
        - Tracking and reframing
        - Video enhancement
        - Photo tools
        - Export and quality
        - Interface and usability
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What should become easier or better?
      placeholder: Describe the result you want, not only the button or setting.
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Why would this matter to you?
  - type: checkboxes
    id: tried
    attributes:
      label: Demo feedback
      options:
        - label: I have tried the public demo.
